[package]
name = "gannyu-input-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gannyu_input_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fst = "0.4"
bincode = "1.3"
rayon = "1.7"
parking_lot = "0.12"
flate2 = "1"
rand = "0.8"
tempfile = "3"
ahash = { version = "0.8", features = ["serde"] }
