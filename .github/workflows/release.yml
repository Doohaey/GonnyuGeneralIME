name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  rime:
    uses: ./.github/workflows/rime.yml
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit
  fcitx5:
    uses: ./.github/workflows/fcitx5.yml
    secrets: inherit
  ibus:
    uses: ./.github/workflows/ibus.yml
    secrets: inherit
  windows:
    uses: ./.github/workflows/windows.yml
    secrets: inherit
  publish:
    needs: [rime, android, fcitx5, ibus, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: GonnyuGeneralIME-${{ steps.product.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - env:
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          regions=()
          while IFS= read -r region; do
            regions+=("$region")
          done < <(python3 platforms/rime/build.py --list-regions)
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "$((4 + ${#regions[@]}))"
          for region in "${regions[@]}"; do
            test -f "release-assets/GonnyuGeneralIME-${PRODUCT_VERSION}-rime-${region}.zip"
          done
          for suffix in android.apk fcitx5.tar.gz ibus.tar.gz windows-installer.exe; do
            test -f "release-assets/GonnyuGeneralIME-${PRODUCT_VERSION}-${suffix}"
          done
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "GonnyuGeneralIME ${PRODUCT_VERSION}" --notes $'- 词典更新与自动发布流程测试。'
