name: macos

on:
  workflow_call:
    inputs:
      release_signing:
        description: Build, sign, and notarize the release PKG
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_signing:
        description: Build, sign, and notarize the release PKG
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - platforms/macos/**
      - platforms/rime/mobile/**
      - engines/rime/**
      - resources/**
      - .github/workflows/macos.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: brew install cmake ninja
      - name: Import release signing identities and notary credentials
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_signing
        shell: bash
        env:
          APP_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in "$APP_P12" "$INSTALLER_P12" "$CERT_PASSWORD" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            test -n "$value" || { echo "macOS release signing secret is missing" >&2; exit 1; }
          done
          signing_dir="$RUNNER_TEMP/gonnyu-signing"
          mkdir -m 700 "$signing_dir"
          printf '%s' "$APP_P12" | base64 -D > "$signing_dir/application.p12"
          printf '%s' "$INSTALLER_P12" | base64 -D > "$signing_dir/installer.p12"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$signing_dir/notary.p8"
          keychain="$signing_dir/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$signing_dir/application.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          # productsign does not use the codesign partition-list path reliably on
          # headless runners. This keychain is ephemeral, so allow non-interactive
          # access to the installer key and delete the keychain after the job.
          security import "$signing_dir/installer.p12" -k "$keychain" -P "$CERT_PASSWORD" -A
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          app_identity="$(security find-identity -v "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          installer_identity="$(security find-identity -v "$keychain" | awk -F '"' '/Developer ID Installer:/ { print $2; exit }')"
          test -n "$app_identity" && test -n "$installer_identity"
          xcrun notarytool store-credentials gonnyu-release \
            --key "$signing_dir/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          printf 'GANNYU_MACOS_APP_SIGN_IDENTITY=%s\n' "$app_identity" >> "$GITHUB_ENV"
          printf 'GANNYU_MACOS_INSTALLER_SIGN_IDENTITY=%s\n' "$installer_identity" >> "$GITHUB_ENV"
          printf 'GANNYU_MACOS_SIGNING_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf 'GANNYU_MACOS_NOTARY_PROFILE=gonnyu-release\n' >> "$GITHUB_ENV"
          printf 'GANNYU_MACOS_NOTARY_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Preflight installer signing and timestamp service
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_signing
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          preflight="$RUNNER_TEMP/gonnyu-installer-signing-preflight"
          mkdir -p "$preflight/root"
          printf 'signing preflight\n' > "$preflight/root/payload.txt"
          pkgbuild --root "$preflight/root" \
            --identifier io.gannyu.input.signing-preflight --version 1 \
            "$preflight/unsigned.pkg"
          productsign --sign "$GANNYU_MACOS_INSTALLER_SIGN_IDENTITY" \
            --keychain "$GANNYU_MACOS_SIGNING_KEYCHAIN" --timestamp \
            "$preflight/unsigned.pkg" "$preflight/signed.pkg"
          pkgutil --check-signature "$preflight/signed.pkg"
          rm -rf "$preflight"
      - name: Rebuild universal librime app from locked source
        shell: bash
        env:
          GANNYU_MACOS_SIGN_IDENTITY: ${{ env.GANNYU_MACOS_APP_SIGN_IDENTITY }}
          GANNYU_MACOS_CI_ADHOC: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_signing) && '1' || '0' }}
        run: bash platforms/macos/build.sh
      - name: Validate bundled engine and input-method host
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/macos/GonnyuInputMethod.app
          plutil -lint "$bundle/Contents/Info.plist"
          codesign --verify --deep --strict "$bundle"
          lipo "$bundle/Contents/MacOS/GannyuInputMethodHost" -verify_arch arm64 x86_64
          GANNYU_RIME_RESOURCE_ROOT=build/rime-macos/resources \
          GANNYU_RIME_USER_DATA_DIR=build/rime-macos/ci-user \
            platforms/macos/.build/apple/Products/Release/GannyuMacOSSmoke --region lancong --input gau
          GANNYU_IMK_SELFTEST=1 "$bundle/Contents/MacOS/GannyuInputMethodHost"
      - name: Build and inspect PKG
        timeout-minutes: 15
        shell: bash
        env:
          GANNYU_MACOS_PACKAGE_SKIP_BUILD: "1"
          GANNYU_MACOS_PACKAGE_SKIP_NOTARIZATION: "1"
          GANNYU_MACOS_UNSIGNED_TEST: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_signing) && '1' || '0' }}
        run: |
          set -euo pipefail
          bash platforms/macos/package.sh
          pkgutil --expand build/macos/GonnyuInputMethod.pkg build/macos/pkg-inspection
          test -x build/macos/pkg-inspection/Scripts/preinstall
          test -x build/macos/pkg-inspection/Scripts/postinstall
          test -x build/macos/pkg-inspection/Scripts/check_installer_version.sh
          expected="$(python3 platforms/macos/installer_version.py '${{ steps.product.outputs.version }}')"
          grep -Fq "version=\"$expected\"" build/macos/pkg-inspection/PackageInfo
      - name: Submit PKG for notarization
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_signing
        id: notarization
        shell: bash
        env:
          NOTARY_PROFILE: ${{ env.GANNYU_MACOS_NOTARY_PROFILE }}
          NOTARY_KEYCHAIN: ${{ env.GANNYU_MACOS_NOTARY_KEYCHAIN }}
        run: |
          set -euo pipefail
          response="$(xcrun notarytool submit build/macos/GonnyuInputMethod.pkg \
            --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" \
            --output-format json)"
          submission_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$response")"
          test -n "$submission_id"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "Apple notarization submission: $submission_id"
      - name: Wait for notarization
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_signing
        shell: bash
        env:
          NOTARY_PROFILE: ${{ env.GANNYU_MACOS_NOTARY_PROFILE }}
          NOTARY_KEYCHAIN: ${{ env.GANNYU_MACOS_NOTARY_KEYCHAIN }}
          SUBMISSION_ID: ${{ steps.notarization.outputs.submission_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response="$(xcrun notarytool info "$SUBMISSION_ID" \
              --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" \
              --output-format json)"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$response")"
            echo "Notarization status ($attempt/120): $status"
            case "$status" in
              Accepted) exit 0 ;;
              Invalid|Rejected) \
                xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "Apple notarization did not complete within 30 minutes" >&2
          exit 1
      - name: Staple and verify notarized PKG
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_signing
        run: |
          set -euo pipefail
          xcrun stapler staple build/macos/GonnyuInputMethod.pkg
          spctl --assess --type install --verbose=4 build/macos/GonnyuInputMethod.pkg
          pkgutil --check-signature build/macos/GonnyuInputMethod.pkg
      - shell: bash
        run: mv build/macos/GonnyuInputMethod.pkg "build/macos/GonnyuGeneralIME-${{ steps.product.outputs.version }}-macos.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-macos
          path: build/macos/GonnyuGeneralIME-${{ steps.product.outputs.version }}-macos.pkg
          if-no-files-found: error
      - name: Remove temporary release credentials
        if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_signing)
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/gonnyu-signing" ]]; then
            security delete-keychain "$RUNNER_TEMP/gonnyu-signing/release.keychain-db" || true
            rm -rf "$RUNNER_TEMP/gonnyu-signing"
          fi
  compatibility:
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release_signing) }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install cmake ninja
      - name: Build and smoke-test the universal host
        env:
          GANNYU_MACOS_CI_ADHOC: "1"
        run: |
          set -euo pipefail
          bash platforms/macos/build.sh
          GANNYU_RIME_RESOURCE_ROOT=build/rime-macos/resources \
          GANNYU_RIME_USER_DATA_DIR=build/rime-macos/matrix-user \
            platforms/macos/.build/apple/Products/Release/GannyuMacOSSmoke --region lancong --input gau
          lipo build/macos/GonnyuInputMethod.app/Contents/MacOS/GannyuInputMethodHost -verify_arch arm64 x86_64
