name: rime-mobile-host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - platforms/rime/**
      - resources/**
      - tests/test_rime_build.py
      - tests/test_rime_mobile_sources.py
      - .github/workflows/rime-mobile-host.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: |
          sudo apt update
          sudo apt install -y \
            libboost-locale-dev \
            libboost-regex-dev \
            libgoogle-glog-dev \
            libleveldb-dev \
            libmarisa-dev \
            libyaml-cpp-dev \
            libopencc-dev \
            libgtest-dev \
            libunwind-dev \
            ninja-build
      - run: python -m pytest -q tests/test_rime_build.py tests/test_rime_mobile_sources.py
      - run: bash platforms/rime/mobile/build_host.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rime-mobile-host
          path: |
            build/rime-mobile/host/build-summary.json
            build/rime-mobile/host/gannyu-data/resource-manifest.json
          if-no-files-found: error
