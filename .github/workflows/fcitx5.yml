name: fcitx5

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - platforms/linux/fcitx5/**
      - resources/**
      - .github/workflows/fcitx5.yml

concurrency:
  group: fcitx5-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resource_cache
        shell: bash
        run: python3 crates/resource-build/resource_cache_key.py >> "$GITHUB_OUTPUT"
      - name: Restore regional resource outputs
        uses: actions/cache@v4
        with:
          path: build/resource-cache
          key: regional-fcitx5-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.resource_cache.outputs.key }}
          restore-keys: |
            regional-fcitx5-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Identify Rust compiler
        id: compiler
        shell: bash
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rust compilation outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-fcitx5-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ steps.resource_cache.outputs.rust_key }}
          restore-keys: |
            rust-fcitx5-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-
      - run: sudo apt-get update
      - run: sudo apt-get install --yes cmake pkg-config fcitx5-modules-dev libfcitx5core-dev
      - env:
          GANNYU_RESOURCE_KEY: ${{ secrets.GANNYU_RESOURCE_KEY }}
        run: bash platforms/linux/fcitx5/package.sh
      - run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          for addon in gonnyu gonnyu-ipa; do
            artifact="build/GonnyuGeneralIME-${{ steps.product.outputs.version }}-fcitx5-$addon.tar.gz"
            package_root="$smoke_root/$addon"
            mkdir -p "$package_root"
            tar -xzf "$artifact" -C "$package_root"
            root="$smoke_root/root-$addon"
            DESTDIR="$root" bash "$package_root/install.sh"
            test -f "$root$(pkg-config --variable=libdir Fcitx5Core)/fcitx5/libfcitx5-$addon.so"
            test -f "$root/usr/share/fcitx5/inputmethod/$addon.conf"
            test -f "$root/usr/share/fcitx5/addon/$addon.conf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-fcitx5
          path: |
            build/GonnyuGeneralIME-${{ steps.product.outputs.version }}-fcitx5-gonnyu.tar.gz
            build/GonnyuGeneralIME-${{ steps.product.outputs.version }}-fcitx5-gonnyu-ipa.tar.gz
          if-no-files-found: error
