name: quality

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - platforms/cli/**
      - platforms/rime/**
      - resources/**
      - tests/**
      - .github/workflows/quality.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - platforms/cli/**
      - platforms/rime/**
      - resources/**
      - tests/**
      - .github/workflows/quality.yml
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pypinyin
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
          GANNYU_LUA_BIN: lua5.4
